workflows:
  ios_kmp_release:
    name: iOS KMP Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=512m'"
      groups:
        - "9999"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $APP_IDENTIFIER

    scripts:
      - name: Make gradlew executable
        script: |
          chmod +x gradlew

      - name: Show versions
        script: |
          xcodebuild -version
          ruby --version
          java -version
          ./gradlew -v

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/iosApp"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Set up code signing
        script: |
          xcode-project use-profiles --verbose

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      # Upload the build to App Store Connect WITHOUT TestFlight beta review. The
      # App Store submission (submit_ios_for_review) only needs the build uploaded
      # + processed to attach it; external TestFlight beta review would also demand
      # Beta App Review + Feedback Email test info this flow never sets, and none of
      # that is needed for an App Store release.
      #
      # We ALWAYS build (this same workflow is re-triggered for version updates, so
      # skipping the build must never happen), then dedup only the UPLOAD by the
      # IPA's EXACT version + build number: a re-run of the same publish reuses the
      # same version, which is already on ASC -> skip; a first publish or an update
      # has a version/build not yet on ASC -> upload. The existence check is a
      # deterministic ASC query (not error-string matching).
      - name: Upload build to App Store Connect (no TestFlight beta review)
        script: |
          IPA="$(find "$CM_BUILD_DIR/build/ios/ipa" -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then echo "ERROR: no IPA found under build/ios/ipa to upload." >&2; exit 1; fi

          # Read the exact version + build number from the built IPA.
          WORK="$(mktemp -d)"
          unzip -qo "$IPA" 'Payload/*.app/Info.plist' -d "$WORK" || true
          PLIST="$(find "$WORK/Payload" -name 'Info.plist' 2>/dev/null | head -1)"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" 2>/dev/null || true)"
          BLD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" 2>/dev/null || true)"
          echo "==> Built IPA is version ${VER:-?} build ${BLD:-?}."

          # True iff a build with THIS exact version+build already exists on ASC.
          build_on_asc() {
            [ -n "$VER" ] && [ -n "$BLD" ] && \
              app-store-connect list-builds --application-id "$CM_APP_STORE_APPLE_ID" \
                --pre-release-version "$VER" --build-version-number "$BLD" --json 2>/dev/null \
              | grep -q '"id"'
          }

          if build_on_asc; then
            echo "==> Build $VER($BLD) is already on App Store Connect - skipping upload (idempotent re-run)."
          else
            echo "==> Uploading $IPA to App Store Connect (upload only, no beta review)."
            if app-store-connect publish --path "$IPA"; then
              echo "==> Upload complete."
            elif build_on_asc; then
              echo "==> Upload reported an error, but build $VER($BLD) is now on ASC - treating as done."
            else
              echo "ERROR: upload of build $VER($BLD) failed and it is not on App Store Connect." >&2
              exit 1
            fi
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  upload_ios_metadata:
    name: Upload iOS metadata
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: 16.2
      groups:
        - "9999"

    scripts:
      - name: Install Ruby dependencies
        script: |
          cd iosApp
          bundle install

      - name: Install Python dependency
        script: |
          python3 -m pip install --user requests

      - name: Generate fastlane metadata from Google Sheet
        script: |
          cd "$CM_BUILD_DIR"
          python3 iosApp/scripts/import_fastlane_metadata_from_gsheet.py

      - name: Validate generated metadata
        script: |
          cd iosApp
          ls fastlane/metadata
          ls fastlane/metadata/en-GB

      - name: Upload metadata to App Store Connect
        script: |
          cd iosApp
          bundle exec fastlane ios upload_metadata

      - name: Set App Store Connect declarations (content rights, price, availability, webhook)
        script: |
          cd iosApp
          bundle exec fastlane ios set_app_compliance

      - name: Web-session declarations — App Privacy + DSA trader status (no .p8 API)
        script: |
          cd iosApp
          bundle exec fastlane ios web_session_declarations

    artifacts:
      - iosApp/fastlane/logs/**/*

  submit_ios_for_review:
    name: Submit iOS for review
    instance_type: mac_mini_m2
    # Apple build processing can take up to ~1h after upload; the lane polls
    # for it, so give the job plenty of headroom.
    max_build_duration: 120

    environment:
      xcode: 16.2
      groups:
        - "9999"

    scripts:
      - name: Install Ruby dependencies
        script: |
          cd iosApp
          bundle install

      - name: Submit for review (wait for build, attach, submit)
        script: |
          cd iosApp
          bundle exec fastlane ios submit_for_review

    artifacts:
      - iosApp/fastlane/logs/**/*